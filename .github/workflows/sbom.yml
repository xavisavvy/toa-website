name: SBOM Generation

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  generate-sbom:
    name: Generate Software Bill of Materials
    runs-on: [self-hosted, Linux, X64]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
        env:
          HUSKY: 0  # Disable Husky in CI
      
      - name: Install CycloneDX
        run: npm install -g @cyclonedx/cyclonedx-npm@6.0.1
      
      - name: Generate SBOM (JSON)
        # --ignore-npm-errors: `npm ls` exits non-zero here because sharp's
        # optional platform binaries show as "extraneous". That is the intended
        # state of the tree; cyclonedx treats the non-zero exit as fatal and the
        # SBOM is complete either way.
        run: cyclonedx-npm --ignore-npm-errors --output-file sbom.json
      
      - name: Generate SBOM (XML)
        run: cyclonedx-npm --ignore-npm-errors --output-format XML --output-file sbom.xml
      
      - name: Generate SBOM (SPDX)
        # Uses the same commit-pinned Trivy action as ci.yml rather than
        # downloading and executing an unverified release binary
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.35.0 (pinned per CVE-2026-33634 advisory)
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'spdx-json'
          output: 'sbom.spdx.json'
        continue-on-error: true
      
      - name: Upload SBOM as artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sbom-${{ github.sha }}
          path: |
            sbom.json
            sbom.xml
            sbom.spdx.json
          retention-days: 90
      
      - name: Attach SBOM to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: |
            sbom.json
            sbom.xml
            sbom.spdx.json
      
      - name: Build Docker image with SBOM
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      
      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
      
      - name: Build and push with SBOM
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      # Uses the same pinned trivy-action as ci.yml's Container Security Scan.
      # The previous install.sh download of Trivy v0.61.0 started failing after
      # that release's assets were pulled (see the CVE-2026-33634 note in ci.yml).
      - name: Generate vulnerability report from SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.35.0 (pinned per CVE-2026-33634 advisory)
        with:
          scan-type: 'sbom'
          scan-ref: 'sbom.json'
          format: 'json'
          output: 'sbom-vulnerabilities.json'
          exit-code: '0'
        continue-on-error: true
      
      - name: Upload vulnerability report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: sbom-vulnerabilities
          path: sbom-vulnerabilities.json
