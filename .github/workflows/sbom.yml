name: SBOM Generation

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  generate-sbom:
    name: Generate Software Bill of Materials
    runs-on: [self-hosted, Linux, X64]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
        env:
          HUSKY: 0  # Disable Husky in CI
      
      - name: Install CycloneDX
        run: npm install -g @cyclonedx/cyclonedx-npm
      
      - name: Generate SBOM (JSON)
        # --ignore-npm-errors: `npm ls` exits non-zero here because sharp's
        # optional platform binaries show as "extraneous". That is the intended
        # state of the tree; cyclonedx treats the non-zero exit as fatal and the
        # SBOM is complete either way.
        run: cyclonedx-npm --ignore-npm-errors --output-file sbom.json
      
      - name: Generate SBOM (XML)
        run: cyclonedx-npm --ignore-npm-errors --output-format XML --output-file sbom.xml
      
      - name: Generate SBOM (SPDX)
        run: |
          # Install spdx-sbom-generator from GitHub releases
          curl -Lo spdx-sbom-generator.tar.gz https://github.com/opensbom-generator/spdx-sbom-generator/releases/download/v0.0.15/spdx-sbom-generator-v0.0.15-linux-amd64.tar.gz
          tar -xzf spdx-sbom-generator.tar.gz
          chmod +x spdx-sbom-generator
          ./spdx-sbom-generator -o sbom.spdx.json
        continue-on-error: true
      
      - name: Upload SBOM as artifact
        uses: actions/upload-artifact@v6
        with:
          name: sbom-${{ github.sha }}
          path: |
            sbom.json
            sbom.xml
            sbom.spdx.json
          retention-days: 90
      
      - name: Attach SBOM to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v1
        with:
          files: |
            sbom.json
            sbom.xml
            sbom.spdx.json
      
      - name: Build Docker image with SBOM
        uses: docker/setup-buildx-action@v3
      
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
      
      - name: Build and push with SBOM
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      # Uses the same pinned trivy-action as ci.yml's Container Security Scan.
      # The previous install.sh download of Trivy v0.61.0 started failing after
      # that release's assets were pulled (see the CVE-2026-33634 note in ci.yml).
      - name: Generate vulnerability report from SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.35.0 (pinned per CVE-2026-33634 advisory)
        with:
          scan-type: 'sbom'
          scan-ref: 'sbom.json'
          format: 'json'
          output: 'sbom-vulnerabilities.json'
          exit-code: '0'
        continue-on-error: true
      
      - name: Upload vulnerability report
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: sbom-vulnerabilities
          path: sbom-vulnerabilities.json
