name: Deploy to Lightsail

# Production deploy for https://talesofaneria.com.
#
# Target: the shared AWS Lightsail VPS at 34.199.135.244, which also hosts
# scrummonsters.com, prestonfarr.com and familytokens.app. Each tenant lives
# in its own /opt/<site> directory and joins the shared `scrummonsters_default`
# docker network; Nginx Proxy Manager terminates TLS on 443 and routes to
# containers by name. See docs/deployment/DEPLOYMENT.md.
#
# There is exactly one environment. The previous staging/production split in
# this file pointed at Replit webhooks that no longer exist.

on:
  # Auto-deploy once the image for this commit is in GHCR.
  workflow_run:
    workflows: ["Docker Build and Push"]
    types: [completed]
    branches: [main]
  # Manual re-deploy (roll the container without a new commit).
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to deploy, e.g. sha-<full-sha> for a rollback (default: latest)'
        required: false
        default: 'latest'
        type: string

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  # Lets the deploy step mint a short-lived GHCR credential for the VPS
  # instead of the box holding a long-lived registry PAT.
  packages: read

env:
  REMOTE_HOST: '34.199.135.244'
  REMOTE_USER: 'ubuntu'
  REMOTE_DIR: '/opt/toa-website'
  SITE_URL: 'https://talesofaneria.com'

jobs:
  deploy:
    name: Deploy to talesofaneria.com
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: production
      url: https://talesofaneria.com

    steps:
      - name: Pull image, migrate, and roll the container
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ env.REMOTE_HOST }}
          username: ${{ env.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          # The box is RAM-pressured; pulling a ~300MB image while swapping
          # can take several minutes. The 10m action default is too tight.
          command_timeout: 25m
          envs: TOA_IMAGE_TAG,GHCR_TOKEN
          script: |
            set -euo pipefail
            cd ${{ env.REMOTE_DIR }}

            echo "[1/5] Refreshing deploy config from main..."
            git fetch origin main
            git reset --hard origin/main

            echo "[2/5] Pulling image from GHCR..."
            # Authenticate with this run's ephemeral GITHUB_TOKEN rather than
            # relying on a registry credential stored on the box. The VPS is
            # shared with other sites, so it should not need to hold a
            # long-lived PAT for this one. Logout runs unconditionally below.
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
            docker compose -f docker-compose.prod.yml pull app

            # Versioned migrations run in a throwaway container off the new
            # image before the live container is replaced, so a bad migration
            # aborts the deploy with the old container still serving.
            # drizzle-kit ships as a runtime dependency for exactly this.
            echo "[3/5] Applying database migrations..."
            # Use a sh wrapper so rollbacks to older images (without drizzle-kit) don't hard-fail.
            docker compose -f docker-compose.prod.yml run --rm --no-deps \
              --entrypoint sh app -c 'if [ -x ./node_modules/.bin/drizzle-kit ]; then ./node_modules/.bin/drizzle-kit migrate; else echo "drizzle-kit not present in image; skipping migrations."; fi'

            echo "[4/5] Recreating app container..."
            docker compose -f docker-compose.prod.yml up -d --force-recreate app

            for i in $(seq 1 45); do
              if docker exec toa-app sh -lc 'curl -sf "http://localhost:${PORT:-5002}/api/health"' > /dev/null 2>&1; then
                echo "Container healthy after ${i} attempts."
                docker image prune -f > /dev/null 2>&1 || true
                exit 0
              fi
              sleep 4
            done

            echo "Health check failed. Recent logs:" >&2
            docker compose -f docker-compose.prod.yml logs --tail 100 app >&2
            exit 1
        env:
          # Consumed by docker-compose.prod.yml's image: interpolation.
          # Compose reads it from the shell environment, not from env_file.
          TOA_IMAGE_TAG: ${{ github.event.inputs.image_tag || 'latest' }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  smoke-test:
    name: Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [deploy]
    if: needs.deploy.result == 'success'
    steps:
      # Hits the public URL, which proves NPM is routing 443 to the new
      # container — not just that the container itself came up.
      - name: Public health endpoint
        run: |
          set -euo pipefail
          for i in $(seq 1 10); do
            if curl -fsS "${{ env.SITE_URL }}/api/health" | grep -q '"status"'; then
              echo "Health OK."
              break
            fi
            [ "$i" = "10" ] && { echo "Health check failed." >&2; exit 1; }
            sleep 6
          done

      - name: Homepage renders
        run: curl -fsS "${{ env.SITE_URL }}" | grep -q "Tales of Aneria"
