name: Lighthouse CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  lighthouse:
    # Pull requests run on GitHub-hosted runners: PR code must not execute on
    # the persistent self-hosted machines (see ci.yml)
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || fromJSON('["self-hosted","Linux","X64"]') }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '^22.19.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        env:
          HUSKY: 0  # Disable Husky in CI

      - name: Build application
        run: npm run build
        env:
          NODE_ENV: production

      - name: Set up Chromium
        # Exports CHROME_PATH: there is no system Chrome on the self-hosted
        # runners for chrome-launcher to auto-detect.
        uses: ./.github/actions/setup-chromium

      - name: Run Lighthouse CI
        # The lockfile-pinned devDependency, not an unversioned global install
        # that would persist on the runner between jobs
        run: npx --no-install lhci autorun
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

      - name: Upload Lighthouse results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: lighthouse-results
          path: .lighthouseci
          retention-days: 30

      - name: Comment PR with Lighthouse results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            
            try {
              const manifestPath = '.lighthouseci/manifest.json';
              if (fs.existsSync(manifestPath)) {
                const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
                const summary = manifest[0];
                
                const comment = `## 🏮 Lighthouse CI Results
                
                📊 **Performance**: ${summary.summary.performance * 100}%
                ♿ **Accessibility**: ${summary.summary.accessibility * 100}%
                ✅ **Best Practices**: ${summary.summary['best-practices'] * 100}%
                🔍 **SEO**: ${summary.summary.seo * 100}%
                
                [View full report](${summary.url})
                `;
                
                github.rest.issues.createComment({
                  issue_number: context.issue.number,
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  body: comment
                });
              }
            } catch (error) {
              console.log('Could not post Lighthouse results:', error.message);
            }
