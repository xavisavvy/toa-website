name: Lighthouse CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  lighthouse:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        env:
          HUSKY: 0  # Disable Husky in CI

      - name: Build application
        run: npm run build
        env:
          NODE_ENV: production

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium for Lighthouse
        # The self-hosted runners have no system Chrome. Reuse the Playwright
        # chromium (same cache the test job uses) rather than adding a second
        # browser install. No --with-deps - see docs/ci-cd/RUNNER_CHROME_DEPS.md.
        run: npx playwright install chromium

      - name: Resolve Chromium path
        # Pin CHROME_PATH so chrome-launcher does not go hunting for a
        # system Chrome that is not there. Resolved at runtime so a Playwright
        # version bump (which changes the chromium-<rev> directory) cannot
        # silently stale this out.
        run: |
          CHROME_PATH="$(node -e "console.log(require('playwright').chromium.executablePath())")"
          echo "Using Chromium at: $CHROME_PATH"
          "$CHROME_PATH" --version
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"

      - name: Run Lighthouse CI
        run: |
          npm install -g @lhci/cli
          lhci autorun
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

      - name: Upload Lighthouse results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-results
          path: .lighthouseci
          retention-days: 30

      - name: Comment PR with Lighthouse results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            
            try {
              const manifestPath = '.lighthouseci/manifest.json';
              if (fs.existsSync(manifestPath)) {
                const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
                const summary = manifest[0];
                
                const comment = `## 🏮 Lighthouse CI Results
                
                📊 **Performance**: ${summary.summary.performance * 100}%
                ♿ **Accessibility**: ${summary.summary.accessibility * 100}%
                ✅ **Best Practices**: ${summary.summary['best-practices'] * 100}%
                🔍 **SEO**: ${summary.summary.seo * 100}%
                
                [View full report](${summary.url})
                `;
                
                github.rest.issues.createComment({
                  issue_number: context.issue.number,
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  body: comment
                });
              }
            } catch (error) {
              console.log('Could not post Lighthouse results:', error.message);
            }
