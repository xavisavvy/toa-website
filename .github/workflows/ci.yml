name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  # security-events: write  # Only needed to upload SARIF (e.g. the Trivy step below)
  pull-requests: read  # gitleaks lists PR commits; nothing here comments on PRs

# Pull requests run on GitHub-hosted runners. This repo is public, and the
# self-hosted runners are persistent machines that also hold the deploy
# credentials and other repos' runners, so code from a PR (including
# Dependabot's freshly bumped packages and their install scripts) must not
# run there. Pushes to main/develop keep using the self-hosted fleet.

# A newer push to the same PR supersedes its older CI run. Pushes to
# main/develop get a group per commit: GitHub keeps only one *pending* run
# per concurrency group and cancels the older one, so a shared per-branch
# group silently dropped CI for any commit pushed while another was queued.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.event.pull_request.number) || format('ci-{0}-{1}', github.ref, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Tests & Coverage
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || fromJSON('["self-hosted","Linux","X64"]') }}
    timeout-minutes: 60
    # The self-hosted runners share one Docker host. Each run gets its own
    # compose project and free host ports (see "Pick test service ports"), so
    # test jobs can overlap. This used to be serialised with a repo-wide
    # concurrency group, but GitHub keeps only one pending job per group and
    # cancels the rest, which cancelled most queued CI runs.
    # Skip CI for version bump commits
    if: "!contains(github.event.head_commit.message, 'chore(release):')"
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit
        env:
          HUSKY: 0  # Disable Husky in CI
      
      - name: Pick test service ports
        # Free host ports for this run's Postgres and Redis. Exported via
        # GITHUB_ENV so docker-compose.test.yml and later steps pick them up.
        run: |
          # Both listeners stay open until both ports are read, so the two
          # ports are guaranteed to differ.
          read -r PG_PORT REDIS_PORT < <(node -e "
            const net = require('net');
            const a = net.createServer().listen(0, () => {
              const b = net.createServer().listen(0, () => {
                console.log(a.address().port, b.address().port);
                a.close(); b.close();
              });
            });")
          test -n "$PG_PORT" && test -n "$REDIS_PORT"
          {
            echo "TEST_COMPOSE_PROJECT=toa-website-test-${{ github.run_id }}-${{ github.run_attempt }}"
            echo "TEST_POSTGRES_PORT=$PG_PORT"
            echo "TEST_REDIS_PORT=$REDIS_PORT"
            echo "TEST_DATABASE_URL=postgresql://test_user:test_password@localhost:$PG_PORT/toa_test"
            echo "TEST_REDIS_URL=redis://localhost:$REDIS_PORT"
          } >> "$GITHUB_ENV"

      - name: Start test services (PostgreSQL + Redis)
        run: docker compose -p "$TEST_COMPOSE_PROJECT" -f docker-compose.test.yml up -d
      
      - name: Wait for PostgreSQL to be ready
        run: |
          echo "⏳ Waiting for PostgreSQL to be healthy..."
          timeout 30 bash -c 'until docker compose -p "$TEST_COMPOSE_PROJECT" -f docker-compose.test.yml exec -T postgres pg_isready -U test_user -d toa_test; do sleep 1; done'
          echo "✅ PostgreSQL is ready"
      
      - name: Wait for Redis to be ready
        run: |
          echo "⏳ Waiting for Redis to be healthy..."
          timeout 30 bash -c 'until docker compose -p "$TEST_COMPOSE_PROJECT" -f docker-compose.test.yml exec -T redis redis-cli ping | grep -q PONG; do sleep 1; done'
          echo "✅ Redis is ready"
      
      - name: Run database migrations
        run: npm run db:push
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
          
      - name: Seed E2E test database
        run: npm run db:seed:e2e
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
          ADMIN_EMAIL: admin@talesofaneria.com
          ADMIN_PASSWORD: ChangeMe123!
          TEST_ADMIN_PASSWORD: testpassword
          
      - name: Set up Chromium
        uses: ./.github/actions/setup-chromium

      - name: TypeScript type checking
        run: npm run check
        
      - name: Build application
        run: npm run build
        
      - name: Run unit tests with coverage
        run: npm run test:coverage
        
      - name: Check if E2E tests can run
        id: check_e2e
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "⚠️  DATABASE_URL not set - E2E tests will be skipped"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "✅ DATABASE_URL configured - E2E tests will run"
          fi
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        
      - name: Run E2E tests
        if: steps.check_e2e.outputs.skip == 'false'
        run: npm run test:e2e
        # Non-blocking for now: the two remaining known gaps are a missing
        # PRINTFUL_API_KEY CI secret (blocks cart.spec.ts and most of
        # checkout-flow.spec.ts) and audit-system.spec.ts targeting
        # /admin/audit-logs, a page that doesn't exist in the app yet.
        # Everything else that was previously failing (visual-regression
        # baselines, SEO/load-stress/printful-webhook/etc.) has been fixed —
        # see PR #41. Remove this once the two gaps above are resolved.
        continue-on-error: true
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
          REDIS_URL: ${{ env.TEST_REDIS_URL }}
          NODE_ENV: test
          # Matches printful-webhook.spec.ts's own fallback default — lets
          # that suite actually exercise HMAC signature verification instead
          # of silently running in the server's "no secret configured" mode.
          PRINTFUL_WEBHOOK_SECRET: test_secret
          # The full E2E suite (~20 spec files, one shared Redis-backed dev
          # server) easily exceeds apiLimiter's 300-req/15min budget, causing
          # unrelated collateral 429s in later spec files. See rate-limiter.ts.
          E2E_DISABLE_RATE_LIMIT: 'true'

      - name: Skip E2E tests
        if: steps.check_e2e.outputs.skip == 'true'
        run: echo "⚠️  E2E tests skipped - DATABASE_URL not configured"

      # No separate "Run contract tests" step: test/contract/** isn't excluded
      # in vitest.config.ts, so `npm run test:coverage` above already runs it.
      # Re-running it here via `npm run test:contract` was a full duplicate
      # execution that, coming after the E2E run, hit the real Redis-backed
      # apiLimiter (300 req/15min) already elevated by every earlier test in
      # this job — every request in the second pass got a spurious 429.

      - name: Run visual regression tests
        if: steps.check_e2e.outputs.skip == 'false'
        run: npm run test:visual
        # Non-blocking for now — see note on the E2E step above. Linux
        # baselines are committed (e2e/visual-regression.spec.ts-snapshots/),
        # verified 18/18 passing locally; kept non-blocking here only because
        # the self-hosted runner can't yet get past the Playwright browser
        # install step (separate, unrelated runner-config issue).
        continue-on-error: true
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
          REDIS_URL: ${{ env.TEST_REDIS_URL }}
          E2E_DISABLE_RATE_LIMIT: 'true'

      - name: Skip visual tests
        if: steps.check_e2e.outputs.skip == 'true'
        run: echo "⚠️  Visual tests skipped - DATABASE_URL not configured"
        
      - name: Cleanup test services
        if: always()
        run: docker compose -p "$TEST_COMPOSE_PROJECT" -f docker-compose.test.yml down -v
        
      - name: Upload coverage reports
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        if: always()
        with:
          files: ./coverage/coverage-final.json
          flags: unittests
          
      - name: Upload test results
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: test-results
          path: |
            coverage/
            playwright-report/
            reports/

  # 1. Container Security Scanning with Trivy
  container-security:
    name: Container Security Scan
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || fromJSON('["self-hosted","Linux","X64"]') }}
    timeout-minutes: 30
    # Skip for version bump commits
    if: "!contains(github.event.head_commit.message, 'chore(release):')"
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build Docker image for scanning
        # v6: v5 pins Node 20, which GitHub deprecated on Actions runners.
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: toa-website:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Attestations MUST be off when load: true. Enabling provenance or
          # sbom makes buildx emit an OCI manifest list, and the docker
          # exporter cannot load one:
          #   ERROR: docker exporter does not currently support exporting
          #   manifest lists
          # They also buy nothing here — this image is only built so Trivy can
          # scan it locally and is never pushed. Supply-chain attestations are
          # produced where they are actually published: sbom.yml (which pushes)
          # and the release image built by docker-build.yml.
          provenance: false
          sbom: false
      
      - name: Run Trivy vulnerability scanner (JSON format)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.35.0 (pinned per CVE-2026-33634 advisory)
        with:
          image-ref: toa-website:${{ github.sha }}
          format: 'json'
          output: 'trivy-results.json'
          severity: 'CRITICAL,HIGH,MEDIUM'
          exit-code: '0'
      
      # SARIF format disabled - requires GitHub Advanced Security for upload
      # - name: Run Trivy vulnerability scanner (SARIF format)
      #   uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.35.0 (pinned per CVE-2026-33634 advisory)
      #   with:
      #     image-ref: toa-website:${{ github.sha }}
      #     format: 'sarif'
      #     output: 'trivy-results.sarif'
      #     severity: 'CRITICAL,HIGH,MEDIUM'
      #     exit-code: '0'
      #     version: 'v0.68.2'
      
      # CodeQL SARIF upload disabled - requires GitHub Advanced Security
      # - name: Upload Trivy results to GitHub Security
      #   uses: github/codeql-action/upload-sarif@v3
      #   if: always()
      #   with:
      #     sarif_file: 'trivy-results.sarif'
      #     category: 'container-security'
      
      - name: Upload Trivy JSON results
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: trivy-results
          path: trivy-results.json

  # CodeQL (SAST) runs through GitHub's code scanning "default setup", not
  # this workflow; its check is "Analyze (javascript-typescript)". Don't add a
  # CodeQL job here: with default setup enabled, GitHub rejects CodeQL results
  # uploaded from a workflow.

  # 2. Dependency Scanning with multiple tools
  dependency-scan:
    name: Dependency Security Scan
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || fromJSON('["self-hosted","Linux","X64"]') }}
    timeout-minutes: 20
    # Skip for version bump commits
    if: "!contains(github.event.head_commit.message, 'chore(release):')"
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
        env:
          HUSKY: 0  # Disable Husky in CI
      
      - name: Run npm audit (production)
        run: npm audit --production --audit-level=high
        continue-on-error: true
      
      - name: Run npm audit (all dependencies)
        run: npm audit --audit-level=low --json > npm-audit.json
        continue-on-error: true
      
      - name: Upload npm audit results
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: npm-audit-results
          path: npm-audit.json
      
      # Optional: Snyk (requires SNYK_TOKEN secret)
      - name: Run Snyk to check for vulnerabilities
        # Runs the image snyk/actions/node wraps, pinned by digest: the action
        # itself pulls the mutable snyk/snyk:node tag and receives SNYK_TOKEN.
        # Digest of snyk/snyk:node as of 2026-10-29; bump it deliberately.
        uses: docker://snyk/snyk@sha256:f905f99880ae071a1c54c6039c6627fdce4f0abc96cab9a867992a5cf884eed8
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
          FORCE_COLOR: 2
          SNYK_INTEGRATION_NAME: GITHUB_ACTIONS
          SNYK_INTEGRATION_VERSION: node
        with:
          args: snyk test --severity-threshold=high --json-file-output=snyk-results.json
      
      - name: Upload Snyk results
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: snyk-results
          path: snyk-results.json

  # 3. Secret Scanning with Gitleaks
  secret-scan:
    name: Secret Scanning
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || fromJSON('["self-hosted","Linux","X64"]') }}
    timeout-minutes: 10
    # Skip for version bump commits
    if: "!contains(github.event.head_commit.message, 'chore(release):')"
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      
      - name: Clear stale gitleaks download
        # gitleaks-action downloads its binary to a fixed /tmp/gitleaks.tmp
        # path. These runners reuse the same $HOME/tmp across jobs (they are
        # not ephemeral), so a prior interrupted download - or another job's
        # concurrent download of the same path - leaves that file behind and
        # every subsequent run fails with "Destination file path
        # /tmp/gitleaks.tmp already exists" before gitleaks ever executes.
        shell: bash
        run: rm -f /tmp/gitleaks.tmp

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  security:
    name: Security Audit
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || fromJSON('["self-hosted","Linux","X64"]') }}
    timeout-minutes: 20
    # Skip for version bump commits
    if: "!contains(github.event.head_commit.message, 'chore(release):')"
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        env:
          HUSKY: 0  # Disable Husky in CI
        
      - name: Run npm audit
        run: npm audit --audit-level=high
        continue-on-error: true
        
      - name: Run security tests
        run: npm run test:security
        
  # 9. License Compliance Scanning
  license-compliance:
    name: License Compliance
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || fromJSON('["self-hosted","Linux","X64"]') }}
    timeout-minutes: 15
    # Skip for version bump commits
    if: "!contains(github.event.head_commit.message, 'chore(release):')"
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
        env:
          HUSKY: 0  # Disable Husky in CI
      
      - name: Run license compliance check
        run: npm run license:check
      
      - name: Upload license report
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: license-compliance-report
          path: reports/license-compliance.json

  # 8. Performance Testing in CI
  performance:
    name: Performance Testing
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || fromJSON('["self-hosted","Linux","X64"]') }}
    timeout-minutes: 30
    needs: [test]
    # Skip for version bump commits
    if: "!contains(github.event.head_commit.message, 'chore(release):')"
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
        env:
          HUSKY: 0  # Disable Husky in CI
      
      - name: Build application
        run: npm run build
      
      - name: Start application
        run: |
          npm start &
          sleep 10
      
      - name: Run load tests
        run: npm run test:load
        continue-on-error: true
      
      - name: Upload performance results
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: performance-results
          path: |
            playwright-report/
            test-results/

  mutation:
    name: Mutation Testing
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || fromJSON('["self-hosted","Linux","X64"]') }}
    # Backstop: without this the job inherits GitHub's 360-minute default and
    # monopolises a self-hosted runner for 6h before being cancelled.
    timeout-minutes: 30
    # Only run on PRs and skip version commits
    if: "github.event_name == 'pull_request' && !contains(github.event.head_commit.message, 'chore(release):')"
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        env:
          HUSKY: 0  # Disable Husky in CI
          
      - name: Run incremental mutation testing
        run: npm run test:mutation:incremental
        # Step-level timeout so continue-on-error still applies -- a job-level
        # cancellation ignores continue-on-error and marks the check failed.
        timeout-minutes: 25
        continue-on-error: true
          
      - name: Upload mutation report
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: mutation-report
          path: reports/mutation/
          
  lint:
    name: Code Quality
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || fromJSON('["self-hosted","Linux","X64"]') }}
    timeout-minutes: 20
    # Skip for version bump commits
    if: "!contains(github.event.head_commit.message, 'chore(release):')"
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        env:
          HUSKY: 0  # Disable Husky in CI
        
      - name: Run TypeScript compiler
        run: npx tsc --noEmit


