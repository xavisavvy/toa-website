# GSD Ingest Manifest for toa-website
# Curated subset of docs/ that contain decisions, requirements, architecture,
# contracts, and forward-looking roadmaps.
# Excludes: how-tos, dated audit reports, phase-completion summaries,
# optimization notes, fix-of-the-week notes, and duplicate variants.
